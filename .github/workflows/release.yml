name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build - ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: antigravity-bypass-russia.exe
            release_name: antigravity-bypass-russia.exe
          - os: macos-15
            target: aarch64-apple-darwin
            binary_name: antigravity-bypass-russia
            release_name: antigravity-bypass-russia-macos-arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            binary_name: antigravity-bypass-russia
            release_name: antigravity-bypass-russia-macos-x64


    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Regression tests (isolated fixtures; destructive harnesses remain ignored)
        run: cargo test --locked --bin antigravity-bypass-russia --target ${{ matrix.target }}

      - name: Socket regression tests
        run: cargo test --locked --test socket_tests --target ${{ matrix.target }}

      - name: Official CLI profiles and rollback
        run: python tests/verify_cli_profiles.py --target ${{ matrix.target }}

      - name: Current App, IDE and CLI versions
        run: python tests/verify_upstream_versions.py

      - name: Launcher compatibility
        run: python tests/verify_wrappers.py

      - name: Standalone macOS launcher packaging
        run: python tests/verify_macos_bundle.py

      - name: macOS source launcher
        run: python tests/verify_macos_source_bundle.py
      - name: macOS owner build kit
        run: python tests/verify_macos_build_kit.py

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Verify release binary and tag
        run: python tests/verify_release.py target/${{ matrix.target }}/release/${{ matrix.binary_name }}

      - name: Prepare binary artifact
        run: python scripts/package_release.py --binary target/${{ matrix.target }}/release/${{ matrix.binary_name }} --target ${{ matrix.target }}

      - name: Install Python 3.9 for packaging compatibility
        if: runner.os == 'Windows'
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Python 3.9 launcher and packaging checks
        if: runner.os == 'Windows'
        run: |
          foreach ($check in @('verify_macos_bundle.py', 'verify_macos_source_bundle.py', 'verify_wrappers.py')) {
            python "tests/$check"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  package:
    name: Package release candidate
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download verified binaries
        uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: dist/raw
          merge-multiple: true

      - name: Prepare Windows files
        run: |
          mkdir -p dist/release
          cp dist/raw/antigravity-bypass-russia.exe dist/raw/unlock_and_restore.ps1 dist/release/

      - name: Bundle native macOS engines
        run: python scripts/bundle_macos_launcher.py --arm64 dist/raw/antigravity-bypass-russia-macos-arm64 --x64 dist/raw/antigravity-bypass-russia-macos-x64 --output dist/release/unlock_and_restore.sh

      - name: Generate checksums
        working-directory: dist/release
        run: sha256sum antigravity-bypass-russia.exe unlock_and_restore.ps1 unlock_and_restore.sh > SHA256SUMS.txt

      - name: Verify exact distribution contents and embedded engines
        run: python tests/verify_distribution.py dist/release --engines dist/raw

      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: release-candidate
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Create GitHub Release
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-candidate
          path: dist

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/antigravity-bypass-russia.exe
            dist/unlock_and_restore.ps1
            dist/unlock_and_restore.sh
          body_path: docs/releases/${{ github.ref_name }}.md
          draft: true
          generate_release_notes: false
          append_body: false
