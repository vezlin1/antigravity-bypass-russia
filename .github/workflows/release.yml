name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build - ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: antigravity-bypass-russia.exe
            release_name: antigravity-bypass-russia.exe
          - os: macos-15
            target: aarch64-apple-darwin
            binary_name: antigravity-bypass-russia
            release_name: antigravity-bypass-russia-macos-arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            binary_name: antigravity-bypass-russia
            release_name: antigravity-bypass-russia-macos-x64


    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Regression tests (isolated fixtures; destructive harnesses remain ignored)
        run: cargo test --locked --bin antigravity-bypass-russia --target ${{ matrix.target }}

      - name: Official CLI profiles and rollback
        run: python tests/verify_cli_profiles.py --target ${{ matrix.target }}

      - name: Launcher compatibility
        run: python tests/verify_wrappers.py

      - name: Standalone macOS launcher packaging
        run: python tests/verify_macos_bundle.py

      - name: macOS source launcher
        run: python tests/verify_macos_source_bundle.py

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Verify release binary and tag
        run: python tests/verify_release.py target/${{ matrix.target }}/release/${{ matrix.binary_name }}

      - name: Prepare binary artifact
        run: python scripts/package_release.py --binary target/${{ matrix.target }}/release/${{ matrix.binary_name }} --target ${{ matrix.target }}

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: dist/*

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Bundle macOS engines into one launcher
        run: python3 scripts/bundle_macos_launcher.py --arm64 dist/antigravity-bypass-russia-macos-arm64 --x64 dist/antigravity-bypass-russia-macos-x64 --output dist/unlock_and_restore.sh

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/antigravity-bypass-russia.exe
            dist/unlock_and_restore.ps1
            dist/unlock_and_restore.sh
          body_path: docs/releases/${{ github.ref_name }}.md
          draft: true
          generate_release_notes: false
          append_body: false
