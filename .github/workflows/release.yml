name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  PYTHONUNBUFFERED: 1

jobs:
  gate:
    name: Checks on this commit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    outputs:
      verified: ${{ steps.verified.outputs.verified }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
      # A green full checks.yml run on this exact commit already ran the unit, CLI and
      # fixture tests and the packaging checks; the release does not repeat them.
      - name: Find a green checks run for this commit
        id: verified
        run: python3 .github/scripts/ci.py verified-run
        env:
          GITHUB_TOKEN: ${{ github.token }}

  checks:
    name: Full checks
    needs: gate
    if: needs.gate.outputs.verified != 'true'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/checks.yml
    with:
      full-suite: true

  build:
    name: Release build - ${{ matrix.target }}
    needs: [gate, checks]
    if: >-
      !cancelled() && needs.gate.result == 'success' &&
      (needs.checks.result == 'success' || (needs.checks.result == 'skipped' && needs.gate.outputs.verified == 'true'))
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: antigravity-bypass-russia.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: antigravity-bypass-russia
          - os: macos-15-intel
            target: x86_64-apple-darwin
            binary_name: antigravity-bypass-russia
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            binary_name: antigravity-bypass-russia
          - os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            binary_name: antigravity-bypass-russia

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Linux packages
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: bash .github/scripts/apt-ensure.sh libssl-dev pkg-config lsof iproute2 openssl

      - name: Cross toolchain
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          rustup target add aarch64-unknown-linux-gnu
          bash .github/scripts/apt-ensure.sh gcc-aarch64-linux-gnu libc6-dev-arm64-cross
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      # The release profile (opt-level z, fat LTO) differs from the tested build, so the
      # release binary itself is built and smoke-checked here.
      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }} ${{ matrix.target == 'aarch64-unknown-linux-gnu' && '--features vendored-openssl' || '' }}

      - name: Linux setup and rollback in isolated namespaces
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: sudo python3 tests/verify_linux_runtime.py target/${{ matrix.target }}/release/${{ matrix.binary_name }}

      - name: Verify release binary and tag
        if: matrix.target != 'aarch64-unknown-linux-gnu'
        run: python tests/verify_release.py target/${{ matrix.target }}/release/${{ matrix.binary_name }}

      - name: Prepare binary artifact
        run: python scripts/package_release.py --binary target/${{ matrix.target }}/release/${{ matrix.binary_name }} --target ${{ matrix.target }}

      - name: Upload Build Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binary-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  package:
    name: Package release candidate
    needs: build
    # Without an explicit condition GitHub requires every job up the chain to
    # succeed, and `checks` is skipped whenever a green run is reused.
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Download verified binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: binary-*
          path: dist/raw
          merge-multiple: true

      # Release files are named antigravity-bypass-<system>[-<cpu>]. Copies under
      # the names used up to 2.5.0 keep old download links working for now;
      # verify_distribution.py checks they are identical. Remove them in 3.2.
      - name: Prepare Windows files
        run: |
          mkdir -p dist/release
          cp dist/raw/antigravity-bypass-russia.exe dist/release/antigravity-bypass-windows.exe

      - name: Prepare Linux files and packages
        run: |
          mkdir -p dist/release
          cp dist/raw/antigravity-bypass-russia-linux-x64 dist/release/antigravity-bypass-linux-x64
          cp dist/raw/antigravity-bypass-russia-linux-arm64 dist/release/antigravity-bypass-linux-arm64
          cp scripts/install.sh dist/release/

          # Build .deb package for x86_64
          mkdir -p dist/deb/DEBIAN dist/deb/usr/bin
          python -c 'import tomllib; v = tomllib.loads(open("Cargo.toml").read())["package"]["version"]; open("dist/deb/DEBIAN/control", "w").write(f"Package: antigravity-bypass-russia\nVersion: {v}\nSection: utils\nPriority: optional\nArchitecture: amd64\nDepends: libc6 (>= 2.35), libssl3 | libssl3t64, iproute2, procps, psmisc, lsof, sudo\nMaintainer: Antigravity Contributors\nHomepage: https://github.com/vezlin1/antigravity-bypass-russia\nDescription: Google Antigravity & Gemini bypass in Russia (No VPN, SmartDNS & SIMD Binary Patcher)\n")'
          cp dist/raw/antigravity-bypass-russia-linux-x64 dist/deb/usr/bin/antigravity-bypass-russia
          chmod 755 dist/deb/usr/bin/antigravity-bypass-russia
          ln -sf /usr/bin/antigravity-bypass-russia dist/deb/usr/bin/ag-bypass
          dpkg-deb --build dist/deb dist/release/antigravity-bypass-linux-x64.deb

      - name: Bundle native macOS engines
        run: python scripts/bundle_macos_launcher.py --arm64 dist/raw/antigravity-bypass-russia-macos-arm64 --x64 dist/raw/antigravity-bypass-russia-macos-x64 --output dist/release/antigravity-bypass-macos.sh

      - name: Copies under the names of 2.5.0
        working-directory: dist/release
        run: |
          cp antigravity-bypass-windows.exe antigravity-bypass-russia.exe
          cp antigravity-bypass-linux-x64 antigravity-bypass-russia-linux-x64
          cp antigravity-bypass-linux-arm64 antigravity-bypass-russia-linux-arm64
          cp antigravity-bypass-linux-x64.deb antigravity-bypass-russia-linux-x64.deb
          cp antigravity-bypass-macos.sh unlock_and_restore.sh

      - name: Generate checksums
        working-directory: dist/release
        run: sha256sum antigravity-bypass-windows.exe antigravity-bypass-macos.sh antigravity-bypass-linux-x64 antigravity-bypass-linux-arm64 antigravity-bypass-linux-x64.deb install.sh antigravity-bypass-russia.exe unlock_and_restore.sh antigravity-bypass-russia-linux-x64 antigravity-bypass-russia-linux-arm64 antigravity-bypass-russia-linux-x64.deb > SHA256SUMS.txt

      - name: Verify exact distribution contents and embedded engines
        run: python tests/verify_distribution.py dist/release --engines dist/raw

      - name: Upload release candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-candidate
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Create GitHub Release
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ !cancelled() && needs.package.result == 'success' && startsWith(github.ref, 'refs/tags/') }}
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-candidate
          path: dist

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/antigravity-bypass-windows.exe
            dist/antigravity-bypass-macos.sh
            dist/antigravity-bypass-linux-x64
            dist/antigravity-bypass-linux-arm64
            dist/antigravity-bypass-linux-x64.deb
            dist/install.sh
            dist/antigravity-bypass-russia.exe
            dist/unlock_and_restore.sh
            dist/antigravity-bypass-russia-linux-x64
            dist/antigravity-bypass-russia-linux-arm64
            dist/antigravity-bypass-russia-linux-x64.deb
          body_path: docs/releases/${{ github.ref_name }}.md
          draft: true
          generate_release_notes: false
          append_body: false

  timing:
    name: Timing report
    needs: [gate, checks, build, package, release]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
      - name: Job times against budgets
        run: python3 .github/scripts/ci.py timing
        env:
          GITHUB_TOKEN: ${{ github.token }}
