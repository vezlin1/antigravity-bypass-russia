name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build - ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: antigravity-bypass-russia.exe
            release_name: antigravity-bypass-russia.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: antigravity-bypass-russia
            release_name: antigravity-bypass-russia-darwin-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            binary_name: antigravity-bypass-russia
            release_name: antigravity-bypass-russia-darwin-x64


    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare binary artifact
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ matrix.binary_name }} dist/${{ matrix.release_name }}

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: dist/*

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Package release assets
        run: |
          ls -la dist/
          cp scripts/unlock_and_restore.ps1 dist/
          cp scripts/unlock_and_restore.sh dist/
          cp configs/xray_routing_rules.json dist/
          chmod +x dist/antigravity-bypass-russia-* dist/*.sh 2>/dev/null || true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*
          generate_release_notes: true
