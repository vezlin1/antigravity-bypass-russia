name: Regression checks

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main, 'fix/**']

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  # CI never attaches a debugger; without debug info the crate builds ~25% faster.
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  upstream-fixtures:
    name: Pinned App, IDE and CLI artifacts
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python tests/verify_upstream_artifacts.py

  test:
    name: Test - ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The runner images ship rustup with a current stable toolchain; only the
      # aarch64 cross target is missing.
      - name: Cross target
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: rustup target add aarch64-unknown-linux-gnu
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install Linux dependencies (x86_64)
        if: runner.os == 'Linux' && matrix.target == 'x86_64-unknown-linux-gnu'
        run: bash .github/scripts/apt-ensure.sh libssl-dev pkg-config lsof iproute2 openssl
      - name: Install Linux dependencies (ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          bash .github/scripts/apt-ensure.sh gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
      - name: Restore compiled Cargo dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
          cache-bin: false
          cache-on-failure: true
          save-if: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
      - name: Isolated regression tests
        if: matrix.target != 'aarch64-unknown-linux-gnu'
        run: ${{ runner.os == 'Linux' && 'bash tests/run_linux_ci_check.sh' || '' }} cargo test --locked --bin antigravity-bypass-russia --target ${{ matrix.target }}
      - name: Socket regression tests
        if: matrix.target != 'aarch64-unknown-linux-gnu'
        run: cargo test --locked --test socket_tests --target ${{ matrix.target }}
      - name: Restore official CLI fixtures
        if: matrix.target != 'aarch64-unknown-linux-gnu'
        id: cli-fixtures
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ag-cli-fixtures
          key: cli-fixtures-v1-${{ matrix.target }}-${{ hashFiles('tests/verify_cli_profiles.py', 'tests/upstream-versions.json') }}
      - name: Official CLI profiles and rollback
        if: matrix.target != 'aarch64-unknown-linux-gnu'
        run: ${{ runner.os == 'Linux' && 'bash tests/run_linux_ci_check.sh' || '' }} python tests/verify_cli_profiles.py --target ${{ matrix.target }} --fixture-dir "${{ runner.temp }}/ag-cli-fixtures" --parallel
      - name: Save verified official CLI fixtures
        if: >-
          matrix.target != 'aarch64-unknown-linux-gnu' &&
          steps.cli-fixtures.outputs.cache-hit != 'true' &&
          github.event_name == 'push' &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ag-cli-fixtures
          key: ${{ steps.cli-fixtures.outputs.cache-primary-key }}
      - name: Installer platform selection
        run: python tests/verify_installer.py

      - name: Launcher compatibility
        run: python tests/verify_wrappers.py
      - name: macOS bundle format
        run: python tests/verify_macos_bundle.py
      - name: macOS source launcher
        run: python tests/verify_macos_source_bundle.py
      - name: macOS owner build kit
        run: python tests/verify_macos_build_kit.py
      # Elsewhere the socket tests already built this binary (test profile) for the smoke checks.
      - name: Build executable
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cargo build --locked --bin antigravity-bypass-russia --target ${{ matrix.target }} --features vendored-openssl
      - name: Linux setup and rollback in isolated namespaces
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: sudo python3 tests/verify_linux_runtime.py target/${{ matrix.target }}/debug/antigravity-bypass-russia
      - name: Read-only CLI and diagnostic export
        if: matrix.target != 'aarch64-unknown-linux-gnu'
        run: python tests/verify_release.py target/${{ matrix.target }}/debug/antigravity-bypass-russia${{ runner.os == 'Windows' && '.exe' || '' }}
      - name: Install Python 3.9 for packaging compatibility
        if: runner.os == 'Windows'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.9'
      - name: Python 3.9 launcher and packaging checks
        if: runner.os == 'Windows'
        run: |
          foreach ($check in @('verify_macos_bundle.py', 'verify_macos_source_bundle.py', 'verify_wrappers.py')) {
            python "tests/$check"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
