[package]
name = "antigravity-bypass-russia"
version = "2.2.2"
edition = "2021"
rust-version = "1.89"
authors = ["Antigravity Contributors"]
license = "MIT"
description = "Clean & Fast Antigravity 2.0 / Gemini Bypass and Rollback Tool for Windows & macOS (No VPN, SmartDNS NRPT & SIMD Binary Patcher)"
readme = "README.md"
keywords = ["antigravity", "antigravity-russia", "gemini", "dns-forwarder", "cross-platform"]

[dependencies]
regex = { version = "1.10", default-features = false, features = ["std", "perf"] }
memchr = "2.7"
native-tls = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "native-tls-alpn", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
object = { version = "0.36", default-features = false, features = ["read", "std"] }
jsonc-parser = { version = "0.26", features = ["cst", "serde"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
time = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_Foundation", "Win32_System_Registry", "Win32_System_RestartManager", "Win32_System_Diagnostics_ToolHelp", "Win32_System_SystemInformation"] }

[target.'cfg(windows)'.build-dependencies]
winres = { version = "0.1", default-features = false }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = false
rpath = false
